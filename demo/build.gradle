apply plugin: 'com.android.application'
apply plugin: "org.jlleitschuh.gradle.ktlint"
apply plugin: "com.google.devtools.ksp"
apply plugin: 'kotlin-allopen'

android {
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    namespace = 'kaufland.com.demo'
    compileSdk = 36
    defaultConfig {
        applicationId = "kaufland.com.demo"
        minSdk = 21
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }

    // workaround for "duplicate files during packaging of APK" issue:
    packaging {
        resources {
            excludes += ['META-INF/ASL2.0', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

allOpen {
    annotation("com.schwarz.kokain.api.EBean")
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.1.0'
    testImplementation 'junit:junit:4.12'
    implementation project(path: ':demolibrary')
    implementation project(path: ':kokain-di')
    implementation project(path: ':kokain-core-api')
    ksp project(':kokain-ksp')
}
