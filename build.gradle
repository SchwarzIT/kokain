// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply plugin: "org.jlleitschuh.gradle.ktlint"
buildscript {
    ext.kotlin_version = '2.3.21'
    ext.groupName = 'com.github.SchwarzIT'
    repositories {
        google()
        mavenCentral()
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jlleitschuh.gradle:ktlint-gradle:14.2.0"
        classpath "org.jetbrains.kotlin:kotlin-allopen:$kotlin_version"
        classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:2.3.9"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

def versionName() {

    if (!hasProperty("version")) {
        // don't care
        return "dummy"
    }

    return property("version")
}

allprojects {
    version = versionName()
    group = groupName

    repositories {
        mavenCentral()
        google()
    }
}
