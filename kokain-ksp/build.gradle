apply plugin: 'kotlin'
apply plugin: 'maven-publish'
apply plugin: 'jacoco'
apply plugin: 'pmd'
apply plugin: 'kotlin-kapt'
apply plugin: "org.jlleitschuh.gradle.ktlint"

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.name
            version project.version
            from components.java
        }
    }
}


jacoco {
    toolVersion = "0.8.7"
}

jacocoTestReport {
    group 'verification'
    dependsOn 'test'

    reports {

        xml.required = true
        html.required = false
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    implementation 'com.squareup:kotlinpoet:2.3.0'
    implementation("com.squareup:kotlinpoet-ksp:2.3.0")
    implementation("com.google.devtools.ksp:symbol-processing-api:2.3.9")
    testImplementation 'junit:junit:4.12'
    testImplementation project(path: ':kokain-core-api', configuration: 'default')
    testImplementation 'dev.zacsweers.kctfork:ksp:0.13.0'
    testImplementation 'org.mockito:mockito-core:1.10.19'
    implementation project(path: ':kokain-generator-lib', configuration: 'default')
}